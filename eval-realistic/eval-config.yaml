vault:
  root: corpus
  skip_dirs:
    - .trash
    - .obsidian
    - Templates
  ignore_tags:
    - ignore
    - secret

index:
  # Benchmark index, gitignored and disposable. Kept beside this config so it
  # survives /tmp cleanup between runs.
  chroma_path: context-data/chroma-realistic
  contextual: false

timestamps:
  policy: obsidian_local
